name: FreeJobAlert Telegram Notifier

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay scheduled runs under load,
    # so treat this as "roughly every 15 min", not exact.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit seen.json back

concurrency:
  group: freejobalert-bot
  cancel-in-progress: false   # never cancel a mid-flight run; let it finish and commit

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit updated state file
        run: | git config user.name "github-actions[bot]" git config user.email "github-actions[bot]@users.noreply.github.com" git add seen.json git diff --quiet --cached || git commit -m "chore: update seen.json [skip ci]" git push
